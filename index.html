<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BDBUZ Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#151515; --card:#20201E; --line:#33332F; --text:#F2F2EE; --muted:#8C8C85;
    --accent:#4F9DFF; --ok:#3DDC84; --warn:#FFB84D; --bad:#FF5C5C; --r:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  header b{font-size:17px}
  header span{color:var(--muted);font-size:13px}
  main{flex:1;overflow-y:auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
  .card .v{font-size:22px;font-weight:600}
  .card .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .row{display:flex;gap:12px}.row>.card{flex:1;min-width:0}
  .center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
  .center .big{font-size:44px}
  .muted{color:var(--muted)}
  .err{color:var(--bad);font-size:13px;word-break:break-word}
  nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button .ic{font-size:20px;line-height:1}
  nav button.on{color:var(--accent)}
  .hide{display:none!important}
  .btn{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:var(--r);padding:12px 16px;font-size:15px;width:100%}
  input.search{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:var(--r);padding:12px 14px;font-size:15px;margin-bottom:12px;outline:none}
  input.search:focus{border-color:var(--accent)}
  .item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .item .l{min-width:0}
  .item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .s{font-size:12px;color:var(--muted);margin-top:3px}
  .item .r{text-align:right;white-space:nowrap}
  .item .amt{font-weight:600}
  .pos{color:var(--ok)}
  .tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:2px 7px;margin-left:6px;color:var(--muted)}
  .chartbox{position:relative;height:200px}
  .bars{display:flex;gap:8px;flex-wrap:wrap}
  .pill{flex:1;min-width:90px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
  .pill b{display:block;font-size:18px}
  .pill span{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">

  <div id="s-load" class="center">
    <div class="big">⏳</div>
    <div class="muted">Yuklanmoqda…</div>
  </div>

  <div id="s-deny" class="center hide">
    <div class="big">🔒</div>
    <b id="deny-title">Kirish yopiq</b>
    <div class="muted" id="deny-text">Bu bo'lim faqat adminlar uchun.</div>
    <div class="err" id="deny-err"></div>
    <button class="btn" style="width:auto" onclick="boot()">Qayta urinish</button>
  </div>

  <div id="s-main" class="hide" style="display:flex;flex-direction:column;height:100%">
    <header><b id="h-title">Bosh sahifa</b><span id="h-user"></span></header>
    <main id="view"></main>
    <nav id="nav">
      <button data-p="home" class="on"><span class="ic">🏠</span>Bosh</button>
      <button data-p="stats"><span class="ic">📊</span>Statistika</button>
      <button data-p="users"><span class="ic">👥</span>Odamlar</button>
      <button data-p="pay"><span class="ic">💳</span>To'lovlar</button>
      <button data-p="bots"><span class="ic">🤖</span>Botlar</button>
    </nav>
  </div>

</div>

<script>
const API = "https://api.bdbuz.store";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{ tg.setHeaderColor("#151515"); tg.setBackgroundColor("#151515"); }catch(e){} }

const $ = id => document.getElementById(id);
function show(id){ ["s-load","s-deny","s-main"].forEach(x=>$(x).classList.toggle("hide", x!==id)); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function money(n){ return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }

async function api(path){
  const initData = tg ? tg.initData : "";
  const r = await fetch(API + path, { headers: { "Authorization": "tma " + initData } });
  let data = null; try{ data = await r.json(); }catch(e){}
  return { status: r.status, data };
}

let ME = null, chart = null, token = 0;

async function boot(){
  show("s-load");
  try{
    if(!tg || !tg.initData){
      return deny("Telegram ichida oching", "Bu sahifa faqat botdagi Mini App tugmasi orqali ishlaydi.");
    }
    const {status, data} = await api("/api/me");
    if(status === 200){
      ME = data;
      $("h-user").textContent = data.name || "";
      show("s-main");
      go("home");
    } else if(status === 403){
      deny("Siz admin emassiz", "Bu bo'lim faqat adminlar uchun.");
    } else {
      deny("Xatolik", "Server javobi: " + status);
    }
  }catch(e){
    deny("Server bilan aloqa yo'q", "Birozdan keyin qayta urinib ko'ring.", String(e));
  }
}

function deny(t, txt, err){
  $("deny-title").textContent = t;
  $("deny-text").textContent = txt;
  $("deny-err").textContent = err || "";
  show("s-deny");
}

const TITLES = { home:"Bosh sahifa", stats:"Statistika", users:"Foydalanuvchilar", pay:"To'lovlar", bots:"Owner botlari" };

function go(p){
  token++;
  if(chart){ chart.destroy(); chart = null; }
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.p===p));
  $("h-title").textContent = TITLES[p];
  const v = $("view");
  v.scrollTop = 0;
  if(p === "home") return pageHome(v);
  v.innerHTML = '<div class="muted" style="text-align:center;padding:30px">Yuklanmoqda…</div>';
  ({stats:pageStats, users:pageUsers, pay:pagePay, bots:pageBots})[p](v, token);
}

// so'rov yuborib, javobni ko'rsatish (xato bo'lsa — "Qayta urinish")
async function load(v, my, path, render){
  try{
    const {status, data} = await api(path);
    if(my !== token) return;           // boshqa bo'limga o'tib ketgan
    if(status !== 200 || !data || !data.ok) throw new Error("javob: " + status);
    render(data);
  }catch(e){
    if(my !== token) return;
    v.innerHTML = '<div class="card"><div class="err">Yuklab bo\'lmadi (' + esc(e.message) + ')</div></div>' +
                  '<button class="btn" onclick="go(document.querySelector(\'#nav .on\').dataset.p)">Qayta urinish</button>';
  }
}

// ---------- Bosh ----------
function pageHome(v){
  v.innerHTML =
    '<div class="card"><h3>Xush kelibsiz</h3><div class="v">' + esc((ME && ME.name) || "Admin") + '</div></div>' +
    '<div class="card"><h3>Server</h3><div class="v" style="color:var(--ok)">● Ishlayapti</div></div>';
}

// ---------- Statistika ----------
function pageStats(v, my){
  load(v, my, "/api/stats", d => {
    v.innerHTML =
      '<div class="row">' +
        '<div class="card"><h3>Foydalanuvchilar</h3><div class="v">' + money(d.users_total) + '</div><div class="sub">bugun +' + d.new_today + ' · 7 kun +' + d.new_7 + '</div></div>' +
        '<div class="card"><h3>Jami balans</h3><div class="v">' + money(d.balance_total) + '</div><div class="sub">UZS</div></div>' +
      '</div>' +
      '<div class="card"><h3>Tushum (UZS)</h3>' +
        '<div class="bars">' +
          '<div class="pill"><b>' + money(d.income_today) + '</b><span>bugun</span></div>' +
          '<div class="pill"><b>' + money(d.income_7) + '</b><span>7 kun</span></div>' +
          '<div class="pill"><b>' + money(d.income_30) + '</b><span>30 kun</span></div>' +
        '</div></div>' +
      '<div class="card"><h3>Oxirgi 30 kun tushumi</h3><div class="chartbox"><canvas id="ch"></canvas></div></div>' +
      '<div class="card"><h3>Owner botlari: ' + d.bots.total + ' ta</h3>' +
        '<div class="bars">' +
          '<div class="pill"><b style="color:var(--ok)">' + d.bots.active + '</b><span>faol</span></div>' +
          '<div class="pill"><b style="color:var(--warn)">' + d.bots.grace + '</b><span>muhlat</span></div>' +
          '<div class="pill"><b style="color:var(--bad)">' + d.bots.stopped + '</b><span>to\'xtagan</span></div>' +
        '</div>' +
        '<div class="bars" style="margin-top:8px">' +
          '<div class="pill"><b>' + d.plans.starter + '</b><span>🥉 Starter</span></div>' +
          '<div class="pill"><b>' + d.plans.pro + '</b><span>🥈 Pro</span></div>' +
          '<div class="pill"><b>' + d.plans.vip + '</b><span>🥇 VIP</span></div>' +
        '</div></div>';
    if(window.Chart){
      chart = new Chart($("ch"), {
        type: "bar",
        data: { labels: d.series.map(x=>x.d),
                datasets: [{ data: d.series.map(x=>x.v), backgroundColor: "#4F9DFF", borderRadius: 4, maxBarThickness: 14 }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false },
                     tooltip: { callbacks: { label: c => money(c.parsed.y) + " UZS" } } },
          scales: {
            x: { ticks: { color: "#8C8C85", maxTicksLimit: 6, maxRotation: 0 }, grid: { display: false }, border: { color: "#33332F" } },
            y: { beginAtZero: true, ticks: { color: "#8C8C85", maxTicksLimit: 4, callback: n => money(n) }, grid: { color: "#2A2A27" }, border: { display: false } }
          }
        }
      });
    }
  });
}

// ---------- Odamlar ----------
let uQ = "", uPage = 1, uTimer = null;
function pageUsers(v, my){
  v.innerHTML = '<input class="search" id="uq" placeholder="Ism, @username yoki ID…" value="' + esc(uQ) + '"><div id="ul"></div><div id="um"></div>';
  $("uq").oninput = e => { uQ = e.target.value; clearTimeout(uTimer); uTimer = setTimeout(()=>{ uPage = 1; $("ul").innerHTML = ""; loadUsers(my); }, 350); };
  uPage = 1;
  loadUsers(my);
}
async function loadUsers(my){
  try{
    const {status, data} = await api("/api/users?page=" + uPage + "&q=" + encodeURIComponent(uQ));
    if(my !== token) return;
    if(status !== 200 || !data.ok) throw new Error("javob: " + status);
    const ul = $("ul");
    if(!ul) return;
    if(uPage === 1 && !data.items.length){ ul.innerHTML = '<div class="muted" style="text-align:center;padding:20px">Hech kim topilmadi</div>'; }
    ul.insertAdjacentHTML("beforeend", data.items.map(u =>
      '<div class="card item"><div class="l"><div class="t">' + esc(u.name || "Ismsiz") +
        (u.username ? ' <span class="muted" style="font-weight:400">@' + esc(u.username) + '</span>' : '') + '</div>' +
        '<div class="s">ID ' + esc(u.id) + ' · ' + esc(u.registered) + ' · botlar: ' + u.bots + '</div></div>' +
      '<div class="r"><div class="amt">' + money(u.balance) + '</div><div class="s">UZS</div></div></div>'
    ).join(""));
    $("um").innerHTML = (data.page < data.pages)
      ? '<button class="btn" id="more">Yana yuklash (' + data.total + ' tadan)</button>'
      : '<div class="muted" style="text-align:center;font-size:12px;padding:6px">Jami: ' + data.total + '</div>';
    const more = $("more");
    if(more) more.onclick = () => { uPage++; more.textContent = "Yuklanmoqda…"; loadUsers(my); };
  }catch(e){
    if(my !== token) return;
    $("um").innerHTML = '<div class="err" style="margin:10px 0">Yuklab bo\'lmadi (' + esc(e.message) + ')</div><button class="btn" onclick="loadUsers(token)">Qayta urinish</button>';
  }
}

// ---------- To'lovlar ----------
function pagePay(v, my){
  load(v, my, "/api/payments", d => {
    if(!d.items.length){ v.innerHTML = '<div class="muted" style="text-align:center;padding:30px">Hozircha to\'lov yo\'q</div>'; return; }
    v.innerHTML = '<div class="muted" style="font-size:12px;margin-bottom:10px">Oxirgi ' + d.items.length + ' ta tasdiqlangan to\'lov</div>' +
      d.items.map(p =>
        '<div class="card item"><div class="l"><div class="t">' + esc(p.name || ("ID " + p.user_id)) +
          (p.username ? ' <span class="muted" style="font-weight:400">@' + esc(p.username) + '</span>' : '') + '</div>' +
          '<div class="s">' + esc(p.time) + ' · ' + esc(p.purpose) + '</div></div>' +
        '<div class="r"><div class="amt pos">+' + money(p.amount) + '</div><div class="s">UZS</div></div></div>'
      ).join("");
  });
}

// ---------- Botlar ----------
const PLAN = { starter:"🥉 Starter", pro:"🥈 Pro", vip:"🥇 VIP" };
const ST = { active:["🟢","faol"], grace:["🟠","muhlat"], stopped:["🔴","to'xtatilgan"] };
function pageBots(v, my){
  load(v, my, "/api/bots", d => {
    if(!d.items.length){ v.innerHTML = '<div class="muted" style="text-align:center;padding:30px">Hozircha owner botlari yo\'q</div>'; return; }
    v.innerHTML = '<div class="muted" style="font-size:12px;margin-bottom:10px">Muddati yaqinlari tepada</div>' +
      d.items.map(b => {
        const st = ST[b.status] || ["⚪", b.status || "?"];
        return '<div class="card item"><div class="l"><div class="t">' + st[0] + ' ' + (b.username ? '@' + esc(b.username) : 'bot ' + esc(b.id)) + '</div>' +
          '<div class="s">Owner: ' + esc(b.owner_name || b.owner) + ' · ID ' + esc(b.owner) + '</div>' +
          '<div class="s">Muddat: ' + esc(b.expires) + '</div></div>' +
          '<div class="r"><div class="amt">' + esc(PLAN[b.plan] || b.plan) + '</div><div class="s">' + money(b.price) + ' UZS/oy</div>' +
          '<div class="s">' + st[1] + (b.running ? '' : ' · o\'chiq') + '</div></div></div>';
      }).join("");
  });
}

document.querySelectorAll("#nav button").forEach(b=> b.onclick = ()=> go(b.dataset.p));
boot();
</script>
</body>
</html>
