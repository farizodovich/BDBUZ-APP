<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BDBUZ Boshqaruv</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#4B2E21; --deep:#3A2218; --card:#58382A; --cream:#F2E6B3;
    --dim:rgba(242,230,179,.62); --line:rgba(242,230,179,.18); --soft:rgba(242,230,179,.08);
    --ok:#A8D08D; --warn:#F0C05A; --bad:#EE8B74; --r:16px;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px}
  button{font-family:inherit;color:inherit}
  #app{height:100%;display:flex;flex-direction:column}
  .hide{display:none!important}

  .top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--deep);border-bottom:1px solid var(--line)}
  .menu{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:20px;line-height:1}
  .brand{flex:1;min-width:0}
  .brand b{font-family:var(--serif);font-size:19px;letter-spacing:.5px;display:block}
  .brand small{color:var(--dim);font-size:12px}
  #who{color:var(--dim);font-size:12px;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:20}
  #scrim.on{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--deep);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:.25s;z-index:21;padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
  #drawer.on{transform:none}
  #drawer h2{font-family:var(--serif);font-size:24px;margin:0 8px 2px}
  #drawer p{margin:0 8px 14px;color:var(--dim);font-size:12px}
  #drawer .grp{margin:12px 10px 4px;color:var(--dim);font-size:11px;letter-spacing:.8px;text-transform:uppercase}
  .mi{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:12px;font-size:15px;text-align:left;width:100%}
  .mi .ic{width:26px;text-align:center;font-size:19px}
  .mi.on{background:var(--cream);color:var(--bg);font-weight:600}

  main{flex:1;overflow-y:auto;padding:16px 16px 28px}
  .muted{color:var(--dim)}
  .center{text-align:center;padding:36px 10px;color:var(--dim)}
  .err{color:var(--bad);font-size:13px;word-break:break-word}

  .hero{background:var(--cream);color:var(--bg);border-radius:22px;padding:20px;margin-bottom:14px}
  .hero small{opacity:.7;font-size:12px;letter-spacing:.4px;text-transform:uppercase}
  .hero .big{font-family:var(--serif);font-size:38px;font-weight:700;margin:4px 0 2px}
  .hero .sub{font-size:13px;opacity:.75}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .tile small{color:var(--dim);font-size:12px}
  .tile .n{font-family:var(--serif);font-size:25px;font-weight:700;margin-top:4px}
  .tile .s{font-size:12px;color:var(--dim);margin-top:3px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
  .box h3{margin:0 0 10px;font-family:var(--serif);font-size:16px}
  .sec{font-family:var(--serif);font-size:17px;margin:18px 2px 10px}

  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row.tap{cursor:pointer}
  .row .l{min-width:0}
  .row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .s{font-size:12px;color:var(--dim);margin-top:3px}
  .row .r{text-align:right;white-space:nowrap}
  .row .a{font-family:var(--serif);font-weight:700}
  .ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}

  .search,.inp{width:100%;background:var(--deep);border:1px solid var(--line);color:var(--cream);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;margin-bottom:12px;font-family:inherit}
  .inp{margin:10px 0}
  textarea.inp{min-height:130px;resize:vertical}
  .search::placeholder,.inp::placeholder{color:var(--dim)}
  .search:focus,.inp:focus{border-color:var(--cream)}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
  .chip{flex:none;background:none;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;color:var(--dim)}
  .chip.on{background:var(--cream);border-color:var(--cream);color:var(--bg);font-weight:600}
  .btn{width:100%;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:13px;font-size:15px}
  .btn.main{background:var(--cream);border-color:var(--cream);color:var(--bg);font-weight:700}
  .btn.danger{border-color:var(--bad);color:var(--bad)}
  .btn:disabled{opacity:.5}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
  .acts .btn{padding:12px 8px;font-size:14px}
  .chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--dim);margin:4px 0 12px}
  .chk input{width:18px;height:18px;accent-color:#F2E6B3}
  .day{font-size:12px;color:var(--dim);margin:14px 2px 4px;letter-spacing:.4px}
  .cnt{font-size:12px;color:var(--dim);text-align:right;margin:-6px 2px 8px}

  .bar{height:9px;border-radius:6px;background:var(--soft);overflow:hidden;margin:6px 0 12px}
  .bar i{display:block;height:100%;background:var(--cream);border-radius:6px}
  .spark{display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:6px}
  .spark i{flex:1;opacity:.85;border-radius:4px 4px 0 0;min-height:3px}
  .chartbox{position:relative;height:210px}
  .pills{display:flex;gap:8px}
  .pill{flex:1;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
  .pill b{display:block;font-family:var(--serif);font-size:18px}
  .pill span{font-size:11px;color:var(--dim)}

  #sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--deep);border-top:1px solid var(--line);
    border-radius:22px 22px 0 0;padding:18px 18px 28px;transform:translateY(105%);transition:.25s;z-index:31}
  #sheet.on{transform:none}
  #sscrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:30}
  #sscrim.on{opacity:1;pointer-events:auto}
  #sheet h2{font-family:var(--serif);margin:0 0 4px;font-size:21px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv span:first-child{color:var(--dim)}
  .kv b{text-align:right}

  #toast{position:fixed;left:16px;right:16px;bottom:24px;background:var(--cream);color:var(--bg);padding:13px 16px;border-radius:14px;
    font-weight:600;z-index:50;opacity:0;transform:translateY(20px);transition:.2s;pointer-events:none;text-align:center}
  #toast.on{opacity:1;transform:none}
  #toast.bad{background:var(--bad);color:#3A2218}
</style>
</head>
<body>
<div id="app">

  <div id="s-load" class="center" style="margin-top:30vh"><div style="font-size:40px">⏳</div>Yuklanmoqda…</div>

  <div id="s-deny" class="center hide" style="margin-top:22vh">
    <div style="font-size:44px">🔒</div>
    <h3 id="d-t" style="font-family:var(--serif);color:var(--cream)">Kirish yopiq</h3>
    <div id="d-x"></div><div class="err" id="d-e"></div><br>
    <button class="btn" style="width:auto;padding:12px 22px" onclick="boot()">Qayta urinish</button>
  </div>

  <div id="s-main" class="hide" style="height:100%;display:flex;flex-direction:column">
    <div class="top">
      <button class="menu" id="menuBtn">☰</button>
      <div class="brand"><b>BDBUZ</b><small id="pname">Bosh sahifa</small></div>
      <span id="who"></span>
    </div>
    <main id="view"></main>
  </div>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <h2>BDBUZ</h2><p>Boshqaruv paneli</p>
  <button class="mi on" data-p="home"><span class="ic">🏠</span>Bosh sahifa</button>
  <button class="mi" data-p="stats"><span class="ic">📊</span>Statistika</button>
  <div class="grp">Odamlar va pul</div>
  <button class="mi" data-p="users"><span class="ic">👥</span>Foydalanuvchilar</button>
  <button class="mi" data-p="pay"><span class="ic">💳</span>To'lovlar</button>
  <button class="mi" data-p="wallet"><span class="ic">💼</span>API hamyon</button>
  <div class="grp">Botlar</div>
  <button class="mi" data-p="bots"><span class="ic">🤖</span>Owner botlari</button>
  <button class="mi" data-p="tpl"><span class="ic">🏷</span>Shablonlar va narxlar</button>
  <div class="grp">Boshqaruv</div>
  <button class="mi" data-p="bc"><span class="ic">📣</span>Xabar yuborish</button>
  <button class="mi" data-p="admins"><span class="ic">👑</span>Adminlar</button>
</aside>

<div id="sscrim"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
const API = "https://api.bdbuz.store";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{ tg.setHeaderColor("#4B2E21"); tg.setBackgroundColor("#4B2E21"); }catch(e){} }

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
function show(id){ ["s-load","s-deny","s-main"].forEach(x=>$(x).classList.toggle("hide", x!==id)); }
const digits = s => String(s || "").replace(/\D/g, "");

async function api(path, body){
  const h = { "Authorization": "tma " + (tg ? tg.initData : "") };
  const o = { headers: h };
  if(body !== undefined){ o.method = "POST"; h["Content-Type"] = "application/json"; o.body = JSON.stringify(body); }
  const r = await fetch(API + path, o);
  let data = null; try{ data = await r.json(); }catch(e){}
  return { status: r.status, data };
}
async function getOk(path){
  const {status, data} = await api(path);
  if(status !== 200 || !data || !data.ok) throw new Error((data && data.message) || ("javob: " + status));
  return data;
}
function toast(msg, bad){
  const t = $("toast"); t.textContent = msg; t.className = "on" + (bad ? " bad" : "");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.className = "", 2800);
}
// POST: muvaffaqiyatda data, aks holda null (xato toast bilan ko'rsatiladi)
async function post(path, body){
  try{
    const r = await api(path, body);
    if(r.status === 200 && r.data && r.data.ok) return r.data;
    toast((r.data && r.data.message) || ("Xatolik (" + r.status + ")"), true);
  }catch(e){ toast("Aloqa yo'q", true); }
  return null;
}
async function run(btn, fn){
  if(btn.disabled) return;
  btn.disabled = true; const t = btn.textContent; btn.textContent = "…";
  try{ await fn(); } finally{ btn.disabled = false; btn.textContent = t; }
}
function ask(text, yes){
  if(tg && tg.showConfirm) tg.showConfirm(text, ok => { if(ok) yes(); });
  else if(confirm(text)) yes();
}

let ME = null, chart = null, token = 0, PAGE = "home";

async function boot(){
  show("s-load");
  try{
    if(!tg || !tg.initData) return deny("Telegram ichida oching", "Bu sahifa faqat bot ichidagi tugma orqali ishlaydi.");
    const {status, data} = await api("/api/me");
    if(status === 200){ ME = data; $("who").textContent = data.name || ""; show("s-main"); go("home"); }
    else if(status === 403) deny("Siz admin emassiz", "Bu bo'lim faqat adminlar uchun.");
    else deny("Xatolik", "Server javobi: " + status);
  }catch(e){ deny("Server bilan aloqa yo'q", "Birozdan keyin qayta urinib ko'ring.", String(e)); }
}
function deny(t, x, e){ $("d-t").textContent = t; $("d-x").textContent = x; $("d-e").textContent = e || ""; show("s-deny"); }

/* ---- yon menyu ---- */
function drawer(on){ $("drawer").classList.toggle("on", on); $("scrim").classList.toggle("on", on); }
$("menuBtn").onclick = () => drawer(true);
$("scrim").onclick = () => drawer(false);
document.querySelectorAll(".mi").forEach(b => b.onclick = () => { drawer(false); go(b.dataset.p); });

/* ---- pastki oyna ---- */
function sheet(html){ $("sheet").innerHTML = html; $("sheet").classList.add("on"); $("sscrim").classList.add("on"); }
function closeSheet(){ $("sheet").classList.remove("on"); $("sscrim").classList.remove("on"); }
$("sscrim").onclick = closeSheet;

const TITLES = { home:"Bosh sahifa", stats:"Statistika", users:"Foydalanuvchilar", pay:"To'lovlar", bots:"Owner botlari",
                 tpl:"Shablonlar va narxlar", wallet:"API hamyon", bc:"Xabar yuborish", admins:"Adminlar" };
function go(p){
  token++; PAGE = p; closeSheet(); stopBcPoll();
  if(chart){ chart.destroy(); chart = null; }
  document.querySelectorAll(".mi").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  $("pname").textContent = TITLES[p];
  const v = $("view"); v.scrollTop = 0;
  v.innerHTML = '<div class="center">Yuklanmoqda…</div>';
  ({home:pageHome, stats:pageStats, users:pageUsers, pay:pagePay, bots:pageBots,
    tpl:pageTpl, wallet:pageWallet, bc:pageBc, admins:pageAdmins})[p](v, token);
}
function fail(v, e){
  v.innerHTML = '<div class="box"><div class="err">Yuklab bo\'lmadi (' + esc(e.message) + ')</div></div><button class="btn" onclick="go(PAGE)">Qayta urinish</button>';
}

const PLAN = { starter:"🥉 Starter", pro:"🥈 Pro", vip:"🥇 VIP" };
const ST = { active:["🟢","faol","ok"], grace:["🟠","muhlat","warn"], stopped:["🔴","to'xtatilgan","bad"] };
function parseDT(s){ const m = /(\d+)\.(\d+)\.(\d+)\s+(\d+):(\d+)/.exec(s||""); return m ? new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]) : null; }
function daysLeft(s){ const d = parseDT(s); return d ? Math.ceil((d - Date.now()) / 86400000) : null; }
const uname = u => u ? "@" + esc(u) : "";

/* ---- pul kiritish oynasi: ➕/➖ + summa (+ xabar belgisi) ---- */
function moneyForm(o){
  let sign = 1;
  sheet(`<h2>${esc(o.title)}</h2><div class="muted">${o.sub}</div>
    <div class="chips" style="margin-top:12px"><button class="chip on" id="mf-p">➕ Qo'shish</button><button class="chip" id="mf-m">➖ Ayirish</button></div>
    <input class="inp" id="mf-a" inputmode="numeric" placeholder="Summa (UZS)" autocomplete="off">
    <label class="chk"><input type="checkbox" id="mf-n" checked> Egasiga xabar yuborilsin</label>
    <button class="btn main" id="mf-go">Saqlash</button>
    <button class="btn" id="mf-bk" style="margin-top:8px">Orqaga</button>`);
  const setSign = s => { sign = s; $("mf-p").classList.toggle("on", s > 0); $("mf-m").classList.toggle("on", s < 0); };
  $("mf-p").onclick = () => setSign(1); $("mf-m").onclick = () => setSign(-1);
  $("mf-bk").onclick = o.back;
  $("mf-go").onclick = e => {
    const n = parseInt(digits($("mf-a").value), 10);
    if(!n) return toast("Summani yozing", true);
    ask(`${sign > 0 ? "Qo'shish" : "Ayirish"}: ${money(n)} UZS. Tasdiqlaysizmi?`, () => run(e.target, async () => {
      const r = await post(o.path, { ...o.extra, amount: sign * n, notify: $("mf-n").checked });
      if(r){ toast("✅ Saqlandi" + (r.notified === false ? " (xabar yetmadi)" : "")); await o.done(r); }
    }));
  };
}
function textForm(o){
  sheet(`<h2>${esc(o.title)}</h2><div class="muted">${o.sub || ""}</div>
    <textarea class="inp" id="tf-t" maxlength="4000" placeholder="Xabar matni…"></textarea>
    <button class="btn main" id="tf-go">Yuborish</button>
    <button class="btn" id="tf-bk" style="margin-top:8px">Orqaga</button>`);
  $("tf-bk").onclick = o.back;
  $("tf-go").onclick = e => {
    const t = $("tf-t").value.trim();
    if(!t) return toast("Matnni yozing", true);
    ask("Xabar yuborilsinmi?", () => run(e.target, async () => {
      const r = await post(o.path, { ...o.extra, text: t });
      if(r){ toast("✅ Yuborildi"); o.back(); }
    }));
  };
}

/* ================= BOSH ================= */
async function pageHome(v, my){
  try{
    const [s, b] = await Promise.all([getOk("/api/stats"), getOk("/api/bots")]);
    if(my !== token) return;
    BOTS = b.items;
    const max = Math.max(1, ...s.series.slice(-14).map(x=>x.v));
    const spark = s.series.slice(-14).map(x => '<i style="background:#4B2E21;height:' + Math.max(4, Math.round(x.v / max * 100)) + '%"></i>').join("");
    const watch = b.items.map(x => ({x, left: daysLeft(x.expires)}))
      .filter(o => o.x.status !== "active" || (o.left !== null && o.left <= 3) || !o.x.running)
      .slice(0, 8);
    v.innerHTML =
      '<div class="hero"><small>Bugungi tushum</small><div class="big">' + money(s.income_today) + ' <span style="font-size:16px">UZS</span></div>' +
        '<div class="sub">7 kunda ' + money(s.income_7) + ' · 30 kunda ' + money(s.income_30) + '</div>' +
        '<div class="spark">' + spark + '</div></div>' +
      '<div class="grid">' +
        '<div class="tile"><small>Foydalanuvchilar</small><div class="n">' + money(s.users_total) + '</div><div class="s">bugun +' + s.new_today + ' · 7 kun +' + s.new_7 + '</div></div>' +
        '<div class="tile"><small>Jami balans</small><div class="n">' + money(s.balance_total) + '</div><div class="s">UZS</div></div>' +
        '<div class="tile"><small>Owner botlari</small><div class="n">' + s.bots.total + '</div><div class="s">faol ' + s.bots.active + ' · muhlat ' + s.bots.grace + ' · to\'xtagan ' + s.bots.stopped + '</div></div>' +
        '<div class="tile"><small>Jami tushum</small><div class="n">' + money(s.income_all) + '</div><div class="s">UZS</div></div>' +
      '</div>' +
      '<div class="sec">Diqqat kerak</div><div class="box">' +
        (watch.length ? watch.map(o => {
          const st = ST[o.x.status] || ["⚪", o.x.status || "?", ""];
          const note = !o.x.running ? "o'chiq" : (o.left !== null && o.left <= 3 ? (o.left <= 0 ? "muddat tugadi" : o.left + " kun qoldi") : st[1]);
          return '<div class="row tap" onclick="botSheet(\'' + esc(o.x.id) + '\')"><div class="l"><div class="t">' + st[0] + ' ' + (o.x.username ? '@' + esc(o.x.username) : 'bot ' + esc(o.x.id)) + '</div>' +
            '<div class="s">' + esc(o.x.owner_name || o.x.owner) + ' · ' + esc(o.x.expires) + '</div></div>' +
            '<div class="r ' + st[2] + '">' + esc(note) + '</div></div>';
        }).join("") : '<div class="muted" style="padding:6px 0">Hammasi joyida ✅</div>') +
      '</div>';
  }catch(e){ if(my === token) fail(v, e); }
}

/* ================= STATISTIKA ================= */
async function pageStats(v, my){
  try{
    const d = await getOk("/api/stats");
    if(my !== token) return;
    const tb = Math.max(1, d.bots.total), tp = Math.max(1, d.plans.starter + d.plans.pro + d.plans.vip);
    const pl = (k, n) => '<div style="display:flex;justify-content:space-between"><span>' + PLAN[k] + '</span><b>' + n + '</b></div><div class="bar"><i style="width:' + Math.round(n / tp * 100) + '%"></i></div>';
    v.innerHTML =
      '<div class="box"><h3>Tushum (UZS)</h3><div class="pills">' +
        '<div class="pill"><b>' + money(d.income_today) + '</b><span>bugun</span></div>' +
        '<div class="pill"><b>' + money(d.income_7) + '</b><span>7 kun</span></div>' +
        '<div class="pill"><b>' + money(d.income_30) + '</b><span>30 kun</span></div></div></div>' +
      '<div class="box"><h3>Oxirgi 30 kun</h3><div class="chartbox"><canvas id="ch"></canvas></div></div>' +
      '<div class="box"><h3>Yangi foydalanuvchilar</h3><div class="pills">' +
        '<div class="pill"><b>' + d.new_today + '</b><span>bugun</span></div>' +
        '<div class="pill"><b>' + d.new_7 + '</b><span>7 kun</span></div>' +
        '<div class="pill"><b>' + d.new_30 + '</b><span>30 kun</span></div></div></div>' +
      '<div class="box"><h3>Botlar holati (' + d.bots.total + ')</h3>' +

let PAYS = [], pFilter = "all";
async function pagePay(v, my){
  try{
    const d = await getOk("/api/payments");
    if(my !== token) return;
    PAYS = d.items; drawPay(v);
  }catch(e){ if(my === token) fail(v, e); }
}
function drawPay(v){
  const kinds = ["all"].concat([...new Set(PAYS.map(p => p.purpose))]);
  const list = PAYS.filter(p => pFilter === "all" || p.purpose === pFilter);
  const sum = list.reduce((a, p) => a + p.amount, 0);
  let last = "", rows = "";
  list.forEach(p => {
    const day = p.time.slice(0, 10);
    if(day !== last){ rows += '<div class="day">' + esc(day) + '</div>'; last = day; }
    rows += '<div class="row"><div class="l"><div class="t">' + esc(p.name || ("ID " + p.user_id)) + (p.username ? ' <span class="muted" style="font-weight:400">@' + esc(p.username) + '</span>' : '') + '</div>' +
      '<div class="s">' + esc(p.time.slice(11)) + ' · ' + esc(p.purpose) + '</div></div><div class="r"><div class="a ok">+' + money(p.amount) + '</div><div class="s">UZS</div></div></div>';
  });
  v.innerHTML =
    '<div class="hero" style="padding:16px"><small>Ko\'rsatilgan to\'lovlar</small><div class="big" style="font-size:30px">' + money(sum) + ' <span style="font-size:14px">UZS</span></div><div class="sub">' + list.length + ' ta to\'lov</div></div>' +
    '<div class="chips">' + kinds.map(k => '<button class="chip' + (k === pFilter ? ' on' : '') + '" data-k="' + esc(k) + '">' + (k === "all" ? "Hammasi" : esc(k)) + '</button>').join("") + '</div>' +
    (list.length ? '<div class="box" style="padding:4px 14px">' + rows + '</div>' : '<div class="center">To\'lov yo\'q</div>');
  v.querySelectorAll(".chip").forEach(c => c.onclick = () => { pFilter = c.dataset.k; drawPay(v); });
}

let BOTS = [], bStatus = "all", bPlan = "all", bQ = "";
async function pageBots(v, my){

function drawBots(v){
  const q = bQ.trim().toLowerCase().replace(/^@/, "");
  const list = BOTS.filter(b =>
    (bStatus === "all" || b.status === bStatus) && (bPlan === "all" || b.plan === bPlan) &&
    (!q || (b.username || "").toLowerCase().includes(q) || String(b.owner).includes(q) || (b.owner_name || "").toLowerCase().includes(q)));
  const chip = (grp, k, t, cur) => '<button class="chip' + (k === cur ? ' on' : '') + '" data-g="' + grp + '" data-k="' + k + '">' + t + '</button>';
  v.innerHTML =
    '<input class="search" id="bq" placeholder="Bot, owner yoki ID…" value="' + esc(bQ) + '">' +

    '<div class="chips">' + chip("p","all","Barcha tarif",bPlan) + chip("p","starter","Starter",bPlan) + chip("p","pro","Pro",bPlan) + chip("p","vip","VIP",bPlan) + '</div>' +

        '<div class="r"><div class="a">' + esc(PLAN[b.plan] || b.plan) + '</div><div class="s">' + money(b.price) + '/oy</div></div></div>';

  bcAud = "all";
  v.querySelectorAll(".chip").forEach(c => c.onclick = () => { bcAud = c.dataset.a; v.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); });
  $("bc-t").oninput = e => $("bc-c").textContent = e.target.value.length + " / 4000";
  $("bc-go").onclick = e => {
    const t = $("bc-t").value.trim();
    if(!t) return toast("Matnni yozing", true);
    ask(`Xabar ${bcAud === "owners" ? "barcha owner'larga" : "HAMMA foydalanuvchilarga"} yuborilsinmi? Qaytarib bo'lmaydi.`, () => run(e.target, async () => {
      const r = await post("/api/broadcast", { text: t, audience: bcAud });
      if(r){ toast(`✅ Boshlandi: ${r.total} kishi`); $("bc-t").value = ""; $("bc-c").textContent = "0 / 4000"; startBcPoll(my); }
    }));
  };
  try{ const s = await getOk("/api/broadcast/status"); if(my === token && s.total) drawBc(s); if(s.running) startBcPoll(my); }catch(e){}
}
function drawBc(s){
  const el = $("bc-st"); if(!el) return;
  const done = s.sent + s.fail, pct = s.total ? Math.round(done / s.total * 100) : 0;
  el.innerHTML = `<div class="box"><h3>${s.running ? "⏳ Yuborilmoqda…" : "✅ Oxirgi yuborish tugadi"}</h3>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="pills"><div class="pill"><b>${s.sent}</b><span>yetdi</span></div><div class="pill"><b>${s.fail}</b><span>yetmadi</span></div><div class="pill"><b>${s.total}</b><span>jami</span></div></div></div>`;
}
function startBcPoll(my){
  stopBcPoll();
  const tick = async () => {
    if(my !== token){ stopBcPoll(); return; }
    try{ const s = await getOk("/api/broadcast/status"); drawBc(s); if(!s.running) stopBcPoll(); }catch(e){}
  };
  tick(); bcTimer = setInterval(tick, 2000);
}

/* ================= ADMINLAR ================= */
async function pageAdmins(v, my){
  try{
    const d = await getOk("/api/admins");
    if(my !== token) return;
    const line = (u, tag, del) => `<div class="row"><div class="l"><div class="t">${esc(u.name || "Ismsiz")} ${u.username ? '<span class="muted" style="font-weight:400">@' + esc(u.username) + "</span>" : ""}</div><div class="s">ID ${esc(u.id)} · ${tag}</div></div>${del ? `<div class="r"><button class="chip" data-del="${esc(u.id)}">➖ Olib tashlash</button></div>` : ""}</div>`;
    v.innerHTML =
      `<div class="box"><h3>Adminlar</h3>${line(d.owner, "👑 ega", false)}${d.env.map(u => line(u, "asosiy admin (.env)", false)).join("")}${d.extra.map(u => line(u, "qo'shilgan", d.can_edit)).join("")}</div>` +
      (d.can_edit
        ? `<div class="box"><h3>➕ Admin qo'shish</h3><div class="muted" style="font-size:12px">ID yoki @username. U avval botga /start bosgan bo'lishi kerak.</div>
           <input class="inp" id="ad-q" placeholder="ID yoki @username" autocomplete="off"><button class="btn main" id="ad-go">Qo'shish</button></div>`
        : `<div class="muted" style="font-size:12px;text-align:center">Adminlarni faqat ega o'zgartira oladi.</div>`);
    if(d.can_edit){
      $("ad-go").onclick = e => {
        const q = $("ad-q").value.trim(); if(!q) return toast("ID yoki @username yozing", true);
        ask(`${q} admin qilinsinmi?`, () => run(e.target, async () => {
          const r = await post("/api/admins/add", { q }); if(r){ toast("✅ Admin qo'shildi"); pageAdmins(v, token); }
        }));
      };
      v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => ask("Adminlikdan olib tashlansinmi?", async () => {
        const r = await post("/api/admins/remove", { id: +b.dataset.del }); if(r){ toast("✅ Olib tashlandi"); pageAdmins(v, token); }
      }));
    }
  }catch(e){ if(my === token) fail(v, e); }
}

boot();
</script>
